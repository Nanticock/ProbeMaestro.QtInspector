name: CI

on: [push, pull_request]

jobs:
  build-msvc2022:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC 2022)
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release

  build-msvc2015-appveyor:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger AppVeyor build
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Using branch: $BRANCH"

          # Discover the correct accountName and projectSlug by matching
          # this repo's name against the projects registered in AppVeyor.
          PROJECTS=$(curl -s \
            -H "Authorization: Bearer $APPVEYOR_TOKEN" \
            -H "Content-Type: application/json" \
            "https://ci.appveyor.com/api/projects")

          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          PROJECT=$(echo "$PROJECTS" | jq -r \
            --arg repo "$REPO_LOWER" \
            '.[] | select((.repositoryName | ascii_downcase) == $repo)' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "No AppVeyor project found matching repository: $GITHUB_REPOSITORY"
            echo "Projects available on this token:"
            echo "$PROJECTS" | jq -r '.[].repositoryName'
            exit 1
          fi

          ACCOUNT_NAME=$(echo "$PROJECT" | jq -r '.accountName')
          PROJECT_SLUG=$(echo "$PROJECT" | jq -r '.slug')
          echo "Found AppVeyor project: $ACCOUNT_NAME / $PROJECT_SLUG"

          RESPONSE=$(curl -s -X POST https://ci.appveyor.com/api/builds \
            -H "Authorization: Bearer $APPVEYOR_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"accountName\": \"$ACCOUNT_NAME\",
              \"projectSlug\": \"$PROJECT_SLUG\",
              \"branch\": \"$BRANCH\"
            }")

          echo "$RESPONSE"

          BUILD_VERSION=$(echo "$RESPONSE" | jq -r '.version')

          if [ "$BUILD_VERSION" = "null" ] || [ -z "$BUILD_VERSION" ]; then
            echo "Failed to get build version from trigger response!"
            exit 1
          fi

          echo "ACCOUNT_NAME=$ACCOUNT_NAME"   >> $GITHUB_ENV
          echo "PROJECT_SLUG=$PROJECT_SLUG"   >> $GITHUB_ENV
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV

        env:
          APPVEYOR_TOKEN: ${{ secrets.APPVEYOR_TOKEN }}

      - name: Wait for AppVeyor build
        run: |
          while true; do
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer $APPVEYOR_TOKEN" \
              "https://ci.appveyor.com/api/projects/$ACCOUNT_NAME/$PROJECT_SLUG/build/$BUILD_VERSION")

            STATUS=$(echo "$RESPONSE" | jq -r '.build.status')
            echo "Status: $STATUS"

            if [ "$STATUS" = "success" ]; then
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ]; then
              exit 1
            fi

            sleep 10
          done

        env:
          APPVEYOR_TOKEN: ${{ secrets.APPVEYOR_TOKEN }}
