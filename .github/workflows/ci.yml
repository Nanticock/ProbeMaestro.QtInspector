name: CI

on: [push, pull_request]

env:
  APPVEYOR_ACCOUNT: MostafaNanticock
  APPVEYOR_PROJECT: probemaestro-qtinspector

jobs:
  build-msvc2022:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC 2022)
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release

  build-msvc2015-appveyor:
    runs-on: ubuntu-latest

    steps:
      - name: Push build config to AppVeyor
        # We push the project YAML via the AppVeyor API before every build because
        # this project has "ignoreAppveyorYml: true" in its AppVeyor settings, so
        # AppVeyor ignores the appveyor.yml in the repository root and uses the
        # configuration stored server-side instead.
        #
        # SCRIPTING LANGUAGE CHOICE — PowerShell Core (pwsh):
        # AppVeyor build_script commands prefixed with "ps:" run in PowerShell.
        # On Windows images this is Windows PowerShell 5.1; on Linux/macOS images
        # AppVeyor uses PowerShell Core (pwsh).  Because PowerShell Core is
        # available on Windows, macOS, and Linux, ALL build script commands in
        # this project MUST be written as PowerShell and prefixed with "ps:".
        # Do NOT use cmd.exe batch syntax (no "cd", "mkdir /Y", "set VAR=",
        # etc.) or Bash syntax here — stick to PowerShell for portability.
        run: |
          # Write YAML to a temp file to avoid shell quoting issues when
          # passing the content to curl (double quotes in generator name
          # would be corrupted by variable expansion in --data-binary "$VAR").
          cat > /tmp/appveyor_build.yml << 'APPVEYOR_YAML_EOF'
image: Visual Studio 2015
build_script:
  - ps: cmake -B build -S . -G 'Visual Studio 14 2015'
  - ps: cmake --build build --config Release
APPVEYOR_YAML_EOF

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            "https://ci.appveyor.com/api/projects/$APPVEYOR_ACCOUNT/$APPVEYOR_PROJECT/settings/yaml" \
            -H "Authorization: Bearer $APPVEYOR_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary "@/tmp/appveyor_build.yml")

          echo "PUT settings/yaml response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "Failed to update AppVeyor project YAML settings (HTTP $HTTP_STATUS)"
            exit 1
          fi

        env:
          APPVEYOR_TOKEN: ${{ secrets.APPVEYOR_TOKEN }}

      - name: Trigger AppVeyor build
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Using branch: $BRANCH"

          RESPONSE=$(curl -s -X POST https://ci.appveyor.com/api/builds \
            -H "Authorization: Bearer $APPVEYOR_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"accountName\": \"$APPVEYOR_ACCOUNT\",
              \"projectSlug\": \"$APPVEYOR_PROJECT\",
              \"branch\": \"$BRANCH\"
            }")

          echo "$RESPONSE"

          BUILD_VERSION=$(echo "$RESPONSE" | jq -r '.version')

          if [ "$BUILD_VERSION" = "null" ] || [ -z "$BUILD_VERSION" ]; then
            echo "Failed to get build version!"
            exit 1
          fi

          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV

        env:
          APPVEYOR_TOKEN: ${{ secrets.APPVEYOR_TOKEN }}

      - name: Wait for AppVeyor build
        run: |
          while true; do
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer $APPVEYOR_TOKEN" \
              "https://ci.appveyor.com/api/projects/$APPVEYOR_ACCOUNT/$APPVEYOR_PROJECT/build/$BUILD_VERSION")

            STATUS=$(echo "$RESPONSE" | jq -r '.build.status')
            echo "Status: $STATUS"

            if [ "$STATUS" = "success" ]; then
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ]; then
              exit 1
            fi

            sleep 10
          done

        env:
          APPVEYOR_TOKEN: ${{ secrets.APPVEYOR_TOKEN }}
