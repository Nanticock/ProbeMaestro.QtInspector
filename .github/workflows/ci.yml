name: CI

on: [push, pull_request]

env:
  APPVEYOR_ACCOUNT: MostafaNanticock
  APPVEYOR_PROJECT: probemaestro-qtinspector

jobs:
  build-msvc2022:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC 2022)
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release

  build-msvc2015-appveyor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run AppVeyor MSVC 2015 build
        run: python .github/scripts/appveyor_cli.py run-cmake-build --generator "Visual Studio 14 2015"
        env:
          APPVEYOR_TOKEN: ${{ secrets.APPVEYOR_TOKEN }}
